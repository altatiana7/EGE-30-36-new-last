function renderVariantList() { $('variantList').innerHTML=DATA.variants.map((v,i)=>`<button class="vbtn ${i===state.variant?'active':''}" data-i="${i}">${v.num}</button>`).join(''); document.querySelectorAll('.vbtn').forEach(btn=>btn.addEventListener('click',()=>{ state.variant=+btn.dataset.i; state.activeQ=30; state.answers={}; state.checked=false; renderVariant(); })); }
function qIndex(q) { return q-30; }
function renderPassage(v) { return esc(v.passage).replace(/\[\[(3[0-6])\]\]/g,(_,q)=>{ const ans=state.answers[q]; let cls='blank'; if(ans) cls+=' filled'; if(+q===state.activeQ) cls+=' active'; if(state.checked && ans) { const idx=qIndex(+q); const correct=v.options[idx][1][+v.key[idx]-1]; cls+=ans===correct?' correct':' wrong'; } return `<button class="${cls}" data-q="${q}">${ans?esc(ans):q}</button>`; }); }
function fitPassageText() { const box=$('passage'); const inner=box.querySelector('.passage-inner'); if(!inner) return; for(let size=16; size>=11.5; size-=.5) { box.style.setProperty('--passage-font', size+'px'); if(inner.scrollHeight<=box.clientHeight && inner.scrollWidth<=box.clientWidth) break; } }
function renderVariant() { const v=DATA.variants[state.variant]; renderVariantList(); $('workTitle').textContent=`Вариант ${v.num}. ${v.title}`; $('passage').innerHTML=`<div class="passage-inner">${renderPassage(v)}</div>`; document.querySelectorAll('.blank').forEach(b=>b.addEventListener('click',()=>{ state.activeQ=+b.dataset.q; renderVariant(); })); renderOptions(); requestAnimationFrame(fitPassageText); }
function renderOptions() { const v=DATA.variants[state.variant]; const idx=qIndex(state.activeQ); const opts=v.options[idx][1]; const correct=opts[+v.key[idx]-1]; $('activeQ').textContent=state.activeQ; $('result').textContent=state.checked ? '' : ''; $('options').innerHTML=opts.map((o,i)=>{ let cls='option'; if(state.answers[state.activeQ]===o) cls+=' chosen'; if(state.checked) { if(o===correct) cls+=' right'; else if(state.answers[state.activeQ]===o) cls+=' bad'; } return `<button class="${cls}" data-opt="${esc(o)}"><b>${i+1}.</b>${esc(o)}</button>`; }).join(''); document.querySelectorAll('#options .option').forEach(btn=>btn.addEventListener('click',()=>{ if(state.checked) return; state.answers[state.activeQ]=btn.dataset.opt; renderVariant(); })); renderExplain(v, idx, correct); }
function renderExplain(v, idx, correct) { const opts=v.options[idx][1]; const block=blockForOptions(opts); if(!state.checked) { $('explainBox').innerHTML=`<div class="block-title">Блок: ${esc(block.title)}</div><div class="small">${esc(block.rule)}</div>`; return; } const chosen=state.answers[state.activeQ]; const term=block.terms.find(t=>t.word.toLowerCase()===correct.toLowerCase()) || block.terms[0]; const verdict=chosen===correct?'Верно':'Нужно: '+correct; $('explainBox').innerHTML=`<div class="block-title">${esc(verdict)}. Блок: ${esc(block.title)}</div><div><b>${esc(correct)}</b> — ${esc(term.translation)}.</div><div class="small"><b>Почему:</b> ${esc(term.pattern)}; ${esc(term.note)}.</div><div class="mini-terms">${block.terms.map(t=>`<div class="mini-term"><b>${esc(t.word)}</b> — ${esc(t.translation)}</div>`).join('')}</div>`; }
function checkVariant() { state.checked=true; const v=DATA.variants[state.variant]; let score=0; for(let q=30;q<=36;q++) { const idx=qIndex(q); const correct=v.options[idx][1][+v.key[idx]-1]; if(state.answers[q]===correct) score++; } renderVariant(); $('result').textContent=`${score}/7`; }
function showAnswers() { const v=DATA.variants[state.variant]; for(let q=30;q<=36;q++) { const idx=qIndex(q); state.answers[q]=v.options[idx][1][+v.key[idx]-1]; } state.checked=true; renderVariant(); $('result').textContent='Ответы'; }
function sprintBlocks() { const q=state.sprintSearch.trim().toLowerCase(); return DATA.choiceBlocks.filter(b=>!q || blockText(b).includes(q)); }
function renderSprintBlocks() { const list=sprintBlocks(); $('selectedCount').textContent=state.sprintSelected.length; $('sprintBlockList').innerHTML=list.map(b=>`<button class="sprint-block ${state.sprintSelected.includes(b.id)?'active':''}" data-id="${b.id}"><b>${esc(b.title)}</b><span class="small">${esc(b.rule)}</span><span class="badge">${b.occurrences.length} раз</span></button>`).join('') || '<div class="small">Ничего не найдено.</div>'; document.querySelectorAll('#sprintBlockList .sprint-block').forEach(btn=>btn.addEventListener('click',()=>toggleSprintBlock(btn.dataset.id))); updateSprintScope(); }
function toggleSprintBlock(id) { state.sprintSelected = state.sprintSelected.includes(id) ? state.sprintSelected.filter(x=>x!==id) : [...state.sprintSelected,id]; renderSprintBlocks(); }
function sprintTerms() { const blocks=DATA.choiceBlocks.filter(b=>state.sprintSelected.includes(b.id)); return blocks.flatMap(b=>b.terms.map(t=>({...t, block:b.title, rule:b.rule}))); }
function sample(arr,n) { return [...arr].sort(()=>Math.random()-.5).slice(0,n); }
function updateSprintScope() { const n=state.sprintSelected.length; $('sprintScope').textContent=n ? `Выбрано блоков: ${n}` : 'Выберите блоки слева'; $('selectedCount').textContent=n; }
function startSprint() { if(!state.sprintSelected.length) state.sprintSelected=sprintBlocks().slice(0,6).map(b=>b.id); state.sprintPool=sprintTerms(); state.sprintScore=0; state.sprintDone=0; state.sprintTotal=20; renderSprintBlocks(); nextSprint(); }
function stopSprintTimer() { if(state.sprintTimer) clearInterval(state.sprintTimer); state.sprintTimer=null; }
function startSprintTimer() { stopSprintTimer(); state.sprintTimeLeft=20; $('timerBar').style.width='100%'; state.sprintTimer=setInterval(()=>{ state.sprintTimeLeft-=.2; $('timerBar').style.width=Math.max(0,state.sprintTimeLeft/20*100)+'%'; if(state.sprintTimeLeft<=0) lockSprint(false,null); },200); }
function nextSprint() { if(state.sprintDone>=state.sprintTotal) { stopSprintTimer(); $('sprintPrompt').textContent=`Результат: ${state.sprintScore}/${state.sprintTotal}`; $('sprintSub').textContent='Можно выбрать другие блоки или запустить ещё раз.'; $('sprintOptions').innerHTML=''; $('sprintResult').textContent=''; return; } const pool=state.sprintPool.length?state.sprintPool:sprintTerms(); if(!pool.length) { $('sprintPrompt').textContent='Выберите блоки слева'; $('sprintOptions').innerHTML=''; return; } const item=pool[Math.floor(Math.random()*pool.length)]; state.sprintItem=item; state.sprintLocked=false; const correct=state.sprintReverse?item.word:item.translation; const prompt=state.sprintReverse?item.translation:item.word; let distractors=sample(pool.filter(t=>t.word!==item.word),3).map(t=>state.sprintReverse?t.word:t.translation); while(distractors.length<3) distractors.push('другой вариант'); const options=sample([correct,...distractors],4); $('sprintPrompt').textContent=prompt; $('sprintSub').textContent=item.block; $('sprintOptions').innerHTML=options.map(o=>`<button class="option" data-ok="${o===correct?'1':'0'}">${esc(o)}</button>`).join(''); $('sprintResult').textContent=''; $('sprintScore').textContent=state.sprintScore; $('sprintDone').textContent=`${state.sprintDone}/${state.sprintTotal}`; document.querySelectorAll('#sprintOptions .option').forEach(btn=>btn.addEventListener('click',()=>lockSprint(btn.dataset.ok==='1',btn))); startSprintTimer(); }
function lockSprint(ok, btn) { if(state.sprintLocked) return; state.sprintLocked=true; stopSprintTimer(); state.sprintDone++; if(ok) state.sprintScore++; document.querySelectorAll('#sprintOptions .option').forEach(b=>{ if(b.dataset.ok==='1') b.classList.add('right'); }); if(btn && !ok) btn.classList.add('bad'); const t=state.sprintItem; $('sprintScore').textContent=state.sprintScore; $('sprintDone').textContent=`${state.sprintDone}/${state.sprintTotal}`; $('sprintResult').textContent=ok ? `Верно: ${t.pattern}` : `Повтори: ${t.word} — ${t.translation}. ${t.pattern}`; }
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('search').addEventListener('input', e=>{ state.search=e.target.value; state.block=0; renderBlocks(); });
$('clearSearch').addEventListener('click',()=>{ $('search').value=''; state.search=''; state.block=0; renderBlocks(); });
$('trainBlock').addEventListener('click',()=>{ const b=currentBlock(); if(!b) return; const occ=b.occurrences[0].split('.'); const vi=DATA.variants.findIndex(v=>String(v.num)===occ[0]); state.variant=Math.max(0,vi); state.activeQ=+occ[1]; state.answers={}; state.checked=false; setView('training'); renderVariant(); });
$('checkVariant').addEventListener('click', checkVariant); $('showAnswers').addEventListener('click', showAnswers);
$('resetVariant').addEventListener('click',()=>{ state.answers={}; state.checked=false; state.activeQ=30; renderVariant(); });
$('randomVariant').addEventListener('click',()=>{ state.variant=Math.floor(Math.random()*DATA.variants.length); state.answers={}; state.checked=false; state.activeQ=30; renderVariant(); });
$('prevVariant').addEventListener('click',()=>{ state.variant=(state.variant-1+DATA.variants.length)%DATA.variants.length; state.answers={}; state.checked=false; state.activeQ=30; renderVariant(); });
$('nextVariant').addEventListener('click',()=>{ state.variant=(state.variant+1)%DATA.variants.length; state.answers={}; state.checked=false; state.activeQ=30; renderVariant(); });
$('sprintSearch').addEventListener('input', e=>{ state.sprintSearch=e.target.value; renderSprintBlocks(); });
$('selectVisible').addEventListener('click',()=>{ const ids=sprintBlocks().map(b=>b.id); state.sprintSelected=[...new Set([...state.sprintSelected,...ids])]; renderSprintBlocks(); });
$('clearSprint').addEventListener('click',()=>{ state.sprintSelected=[]; renderSprintBlocks(); });
$('startSprint').addEventListener('click', startSprint);
$('nextSprint').addEventListener('click', nextSprint);
$('flipSprint').addEventListener('click',()=>{ state.sprintReverse=!state.sprintReverse; nextSprint(); });
renderBlocks(); renderVariant(); renderSprintBlocks();
</script>
</body>
</html>
